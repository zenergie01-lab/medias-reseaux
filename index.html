<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'oracle du travail — Livret d'accompagnement</title>
<meta name="description" content="Livret de l'oracle du travail : 64 cartes pour éclairer votre parcours professionnel. Par Esseline Guettier.">
<meta property="og:title" content="L'oracle du travail — Livret">
<meta property="og:description" content="64 cartes pour éclairer votre parcours professionnel.">
<meta property="og:image" content="/apercu.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2433;--soft:#6d6377;--gold:#b08a4a;--bg:#f7f2ea;--card:#fffdf9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at top,#efe4d2 0%,var(--bg) 60%);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
  main{max-width:440px;width:100%;text-align:center}
  .kicker{letter-spacing:.22em;text-transform:uppercase;font-size:.72rem;color:var(--gold);margin-bottom:14px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.6rem;line-height:1.05;margin-bottom:12px}
  .sub{color:var(--soft);font-size:.98rem;line-height:1.55;margin-bottom:28px}
  .cover{display:block;width:62%;margin:0 auto 30px;border-radius:6px;box-shadow:0 18px 40px -18px rgba(43,36,51,.45),0 0 0 1px rgba(176,138,74,.25);background:var(--card)}
  .btn{display:block;width:100%;padding:16px 20px;border-radius:999px;font-weight:500;font-size:1rem;text-decoration:none;margin-bottom:12px;transition:transform .15s ease,box-shadow .15s ease}
  .btn:active{transform:scale(.98)}
  .primary{background:var(--ink);color:#fff;box-shadow:0 10px 24px -12px rgba(43,36,51,.7)}
  .ghost{border:1px solid rgba(43,36,51,.25);color:var(--ink);background:transparent}
  blockquote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.25rem;line-height:1.4;color:var(--ink);margin:30px 6px 18px}
  footer{font-size:.8rem;color:var(--soft);margin-top:22px}
  .sep{width:40px;height:1px;background:var(--gold);margin:0 auto 22px;opacity:.7}
</style>
</head>
<body>
<main>
  <p class="kicker">Livret d'accompagnement</p>
  <h1>L'oracle<br>du travail</h1>
  <p class="sup sub">64 cartes pour mieux comprendre votre situation, éclairer vos choix et explorer de nouvelles possibilités.</p>

  <a href="/livret-oracle-du-travail.pdf" target="_blank" rel="noopener">
    <img class="cover" src="/apercu.jpg" alt="Première page du livret : Bienvenue dans l'oracle du travail" width="640" height="924">
  </a>

  <a class="btn primary" href="/livret-oracle-du-travail.pdf" target="_blank" rel="noopener">Lire le livret</a>
  <a class="btn ghost" href="/livret-oracle-du-travail.pdf" download="livret-oracle-du-travail.pdf">Télécharger le PDF</a>

  <blockquote>« Votre chemin professionnel vous appartient. »</blockquote>
  <div class="sep"></div>
  <footer>Conception et textes : Esseline Guettier</footer>
</main>
</body>
</html>
